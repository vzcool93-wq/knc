<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNC Маршрут</title>
<meta name="theme-color" content="#64001b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* VOICE: fast, glanceable, used at a stop with cars waiting.
   IDEA: traffic-signal colour coding — every kind of action has its own colour.
   PICTURE: the next-stop card: blue = where, yellow = how to get in, green = send, black = done.
   COLOUR and TYPE: neutral ground, brand burgundy only in the header; Oswald for names, Inter for text.
   LAYOUT: one column; next stop, then the route list. */
:root{color-scheme:light dark;--bg:light-dark(#f2f2f4,#0f0f12);--card:light-dark(#ffffff,#1c1c21);--ink:light-dark(#111114,#f4f4f6);--muted:light-dark(#686872,#a3a3ad);--line:light-dark(#dcdce2,#2e2e36);--soft:light-dark(#ececf0,#26262d);
--brand:#64001b;--cream:#f3ece0;
--map:#1a62d6;--mapbg:light-dark(#e8f0fe,#132744);--mapink:light-dark(#0b3f99,#a9c7ff);
--go:#138a3c;--note:light-dark(#fff3c4,#3a3000);--notebd:#f2b705;--noteink:light-dark(#3d2e00,#ffe596)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,Roboto,sans-serif;overflow-x:clip}
.cond{font-family:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;font-stretch:condensed;text-transform:uppercase;letter-spacing:.05em}
header{background:var(--brand);color:var(--cream);padding:10px max(4vw,14px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr{display:flex;gap:8px;flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap}
header h1{margin:0;font-size:22px;line-height:1;font-weight:600;white-space:nowrap;flex:0 0 auto}
@media(max-width:520px){header h1{flex:1 1 100%}.hdr{flex:1 1 100%;justify-content:stretch}.hdr .park{flex:1;justify-content:center}}
.park{text-decoration:none;color:inherit;display:flex;align-items:baseline;gap:8px;min-height:44px;align-items:center;white-space:nowrap;background:rgba(0,0,0,.25);border-radius:10px;padding:6px 10px}
.park small{font-size:13px;opacity:.9}.park b{font-size:20px;white-space:nowrap;font-variant-numeric:tabular-nums}
.boss{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--cream);color:var(--brand);text-decoration:none;transition:transform .25s cubic-bezier(.22,1,.36,1)}.boss b{font-size:16px}.boss small{font-size:12px;opacity:.75}.boss:active{transform:scale(.95);transition-duration:.08s}
main{max-width:640px;margin:0 auto;padding:12px max(3vw,10px) 40px}
.sec{font-size:14px;color:var(--muted);margin:16px 2px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sec span{flex:1}
.panel{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.top .av{width:52px;height:52px;font-size:22px}
.top h2{margin:0;font-size:clamp(22px,7vw,38px);line-height:1.1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addr{display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--mapbg);border:2px solid var(--map);border-radius:14px;padding:10px 12px;margin-bottom:10px;color:var(--mapink)}
.addrrow{display:flex;gap:8px;margin-bottom:10px}.addrrow .addr{flex:1;margin:0}
.pin{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;border:2px solid var(--map);background:var(--card);color:var(--mapink);text-decoration:none;font-size:22px;transition:transform .25s cubic-bezier(.22,1,.36,1)}.pin small{font-size:11px;font-weight:600}.pin:active{transform:scale(.94);transition-duration:.08s}
.addr .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--map);color:#fff;display:grid;place-items:center;font-size:20px}
.addr b{font-size:17px;overflow-wrap:anywhere;display:block}.addr small{display:block;font-size:12px;font-weight:600;opacity:.85}
.note{background:var(--note);border:2px solid var(--notebd);color:var(--noteink);border-radius:14px;padding:10px 12px;margin-bottom:10px;white-space:pre-line;font-size:17px;line-height:1.5}
.note strong{font-size:24px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;font-weight:600;color:var(--go);margin:12px 2px 6px}
.prev{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--muted);background:var(--soft);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:8px}.prev span{flex:1;padding-top:4px}
.shuf{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:var(--card);font-size:18px;cursor:pointer}
.mins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.min{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;border-radius:14px;background:var(--go);color:#fff;text-decoration:none;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.min b{font-family:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;font-stretch:condensed;font-size:30px;line-height:1}.min small{font-size:12px;opacity:.9}
.min:active{transform:translateY(1px);box-shadow:none}
.arrive{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;margin-top:8px;border-radius:14px;background:#e8590c;color:#fff;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.22,1,.36,1)}
.arrive b{font-size:19px}.arrive small{font-size:13px;opacity:.92;padding:0 10px;text-align:center}
.arrive:active{transform:scale(.96);transition-duration:.08s}
.btns{display:grid;gap:8px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:54px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;text-decoration:none;border:2px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;padding:0 12px;text-align:center}
.btn.done{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:17px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
a:focus-visible,button:focus-visible{outline:3px solid var(--map);outline-offset:2px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.item{display:flex;align-items:center;gap:2px;border-radius:14px;background:var(--card);padding-right:2px;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.item.first{outline:2px solid var(--go)}
.row{display:flex;align-items:center;gap:12px;flex:1;min-height:60px;padding:8px 6px 8px 10px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.nm{font-family:"sans-serif-condensed","Roboto Condensed","Arial Narrow",sans-serif;font-stretch:condensed;font-weight:600;font-size:20px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{display:inline-block;margin-left:6px;font-size:12px;vertical-align:middle;background:var(--note);color:var(--noteink);border:1px solid var(--notebd);border-radius:6px;padding:0 5px;font-family:system-ui,Roboto,sans-serif;letter-spacing:0;text-transform:none;font-weight:600}
.item.delivered{opacity:.55}.item.delivered .nm{text-decoration:line-through}.item.delivered .av{background:var(--go);font-size:13px;gap:1px;display:flex;align-items:center;justify-content:center}.item.delivered .av i{font-style:normal;font-size:15px}
.item.off{opacity:.4}.item.off .nm{text-decoration:line-through}.item.off .av{background:var(--muted)}
.item{-webkit-touch-callout:none}.item.holding{transform:scale(.985);transition:transform .4s ease;background:var(--soft)}
.item.drag{position:relative;z-index:3;opacity:1;box-shadow:0 14px 34px rgba(0,0,0,.32);scale:1.03;transition:scale .2s ease,box-shadow .2s ease}
.tog{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.handle{flex:none;width:44px;height:52px;border:0;background:none;color:var(--muted);font-size:24px;cursor:grab;touch-action:none}
.tb{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-transform:none;letter-spacing:0;font-family:system-ui,Roboto,sans-serif}
.empty{text-align:center;padding:22px 10px;color:var(--muted)}
.back{font:inherit;font-weight:700;background:none;border:0;color:var(--map);padding:6px 0 12px;min-height:44px;cursor:pointer}
#detail{display:none}
/* ===== вкладки ===== */
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.tab span{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6;transition:all .2s}
.tab.on{color:var(--brand2)}.tab.on span{filter:none;opacity:1;transform:scale(1.1)}
#toast{bottom:calc(76px + env(safe-area-inset-bottom))}
main[hidden]{display:none}
#kitchen{max-width:640px;margin:0 auto;padding:12px max(3vw,10px) 40px}
/* ===== таймеры ===== */
#timers{position:sticky;top:0;z-index:35;display:none;flex-wrap:wrap;gap:6px;padding:8px max(3vw,10px);background:var(--bg);border-bottom:1px solid var(--line)}
#timers.show{display:flex}
.tmr{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border-radius:12px;background:#fff3c4;color:#3d2e00;border:2px solid #f2b705;cursor:pointer;font-size:14px}
.tmr b{font-size:18px;font-variant-numeric:tabular-nums;min-width:52px}
.tmr .tl{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tmr button{min-width:38px;height:38px;border:0;border-radius:9px;background:rgba(0,0,0,.08);color:inherit;font:inherit;font-weight:800;cursor:pointer}
.tmr.ring{background:#d93025;border-color:#d93025;color:#fff;animation:ring .8s ease-in-out infinite}
.tmr.ring button{background:#fff;color:#d93025;min-width:52px}
@keyframes ring{50%{transform:scale(1.05)}}
/* ===== техкарта ===== */
.rav{background:var(--brand)!important;font-size:18px}
.rcp .rhead small{color:var(--muted);font-size:13px}.rcp h2{margin:2px 0 6px;font-size:clamp(22px,6.5vw,30px);line-height:1.1}
.rmeta{margin:0 0 4px;color:var(--muted);font-size:14px}
.pctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.plbl{font-weight:700}
.pbtn{width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-size:26px;font-weight:700;cursor:pointer}
.pnum{width:80px;height:52px;text-align:center;font:inherit;font-size:26px;font-weight:800;border-radius:14px;border:2px solid var(--go);background:var(--bg);color:var(--ink)}
.cookbtn{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--go);color:#fff;font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.ing{padding:6px 10px;margin-bottom:8px}.ing h3{margin:8px 4px 4px;font-size:15px;color:var(--brand2)}
.ingrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 4px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.ingrow:first-of-type{border-top:0}
.ck{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff}
.ingrow.on .ck{background:var(--go);border-color:var(--go)}.ingrow.on .iname,.ingrow.on .iamt{opacity:.45}
.iname{flex:1;font-size:16px}.iname small,.iamt small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.iamt{flex:none;text-align:right;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{margin-bottom:8px}.step.sdone{opacity:.55}
.shead{display:flex;align-items:center;gap:10px}.shead b{flex:1;font-size:17px}
.snum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--cream);display:grid;place-items:center;font-weight:800}
.sdone .snum{background:var(--go)}
.sck{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.temp{display:inline-block;margin:8px 0 0;padding:4px 10px;border-radius:10px;background:light-dark(#ffe9dc,#3a1d0e);color:light-dark(#8a3200,#ffb27a);font-weight:700;font-size:14px}
.temp.big{font-size:18px;padding:6px 14px}
.stext{margin:8px 0 0;font-size:16px;line-height:1.6}
.amt{display:inline-block;padding:0 7px;border-radius:7px;background:var(--mapbg);color:var(--mapink);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.tchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tchip{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid #f2b705;background:#fff3c4;color:#3d2e00;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tchip.on{display:inline-flex;align-items:center;opacity:.7;cursor:default}
.tchips.big .tchip{min-height:56px;font-size:17px;flex:1 1 auto}
.info p{margin:0 0 8px;font-size:15px}.info p:last-child{margin:0}

/* ===== фасовка ===== */
#pack{max-width:640px;margin:0 auto;padding:12px max(3vw,10px) 40px}
#ptext{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:200px}
.pstat .pnums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.pnums div{background:var(--soft);border-radius:12px;padding:8px 12px}.pnums b{display:block;font-size:28px;line-height:1.1}.pnums b small{font-size:16px;color:var(--muted)}.pnums span{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pwarn{background:var(--note);border:2px solid var(--notebd);color:var(--noteink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:14px;font-weight:600}
.pav{background:var(--brand)!important}
.flag.fl3{background:#fde3e1;color:#a3160b;border-color:#d93025}
.modb{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:#d93025;color:#fff;font-size:12px;font-weight:800;vertical-align:middle}
.prow .iamt{font-size:20px}
.pdish{margin-bottom:8px;padding:8px 10px}.pdish.pdone{opacity:.55}
.pdh{display:flex;align-items:center;gap:8px;margin:4px 4px 6px}.pdh b{flex:1;font-size:16px}.pcount{font-weight:800;font-variant-numeric:tabular-nums;background:var(--soft);border-radius:8px;padding:2px 8px}
/* ===== режим готовки ===== */
.cook .ctop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cook .ctop span{color:var(--muted);font-size:13px;flex:1;text-align:right}
.cprog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 12px}.cprog i{display:block;height:100%;background:var(--go);transition:width .5s cubic-bezier(.22,1,.36,1)}
.cstep{margin:0;color:var(--muted);font-weight:700}
.ctitle{margin:4px 0 8px;font-size:clamp(28px,8vw,40px);line-height:1.05}
.ctext{font-size:clamp(19px,5.2vw,23px);line-height:1.6;margin:12px 0}
.ctext .amt{padding:1px 8px}
.cnav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:10px;margin-top:20px}
.cnav .btn{min-height:64px;font-size:17px}.cnav .btn[disabled]{opacity:.35}
.cnext{background:var(--go)!important;border-color:var(--go)!important;color:#fff!important}

.min.copied,.arrive.copied{outline:3px solid #f2b705;outline-offset:2px}
.backup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.backup .btn{font-size:14px;min-height:46px;background:transparent;border-style:dashed;color:var(--muted)}
.welcome h2{margin:6px 0;font-size:26px}.welcome p{margin:0}
.road{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;padding:8px 12px;border-radius:14px;background:var(--soft)}
.road .home{font-size:24px;flex:none;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.road .track{position:relative;flex:1;height:30px;background:repeating-linear-gradient(90deg,var(--muted) 0 10px,transparent 10px 18px) center/100% 2px no-repeat}
.road .car{position:absolute;top:2px;line-height:0;filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 1px 1px rgba(0,0,0,.3));transition:left 1s linear,transform 1s linear;animation:bump .5s ease-in-out infinite alternate}
.road .eta{flex:none;font-weight:700;font-size:15px;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}
.road.arrived .car{transition:left 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1);animation:none}
.road.arrived .home{transform:scale(1.25)}
.road.arrived .eta{color:var(--go)}
@keyframes bump{from{translate:0 0}to{translate:0 -2px}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;display:block;margin:-4px 0 0 -4px}
.finish{text-align:center;padding:22px 16px;background:linear-gradient(180deg,light-dark(#eaf7ee,#12261a),var(--card));animation:enter .7s cubic-bezier(.22,1,.36,1)}
.finish .big{font-size:56px;line-height:1;margin-bottom:6px;animation:pop 1s cubic-bezier(.22,1,.36,1)}
.finish h2{margin:0 0 6px;font-size:32px;color:var(--go)}
.finish p{margin:0 0 16px;color:var(--muted)}
.finish .addrrow{text-align:left}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:none}}
.today{display:block;width:100%;text-align:left;font:inherit;font-size:17px;font-weight:600;background:light-dark(#ffe3ec,#3a1424);color:light-dark(#7a0b33,#ffb3cb);border:2px solid #e0457b;border-radius:14px;padding:10px 12px;margin-bottom:10px;white-space:pre-line;cursor:pointer}
.today small{display:block;font-size:12px;font-weight:700;opacity:.85}
.pinbtn{font-size:19px;margin-right:6px}
.flag.fl2{background:light-dark(#ffe3ec,#3a1424);color:light-dark(#7a0b33,#ffb3cb);border-color:#e0457b}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:14px;font-weight:600;min-height:40px;padding:0 12px;border-radius:20px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.chip:active{transform:scale(.95)}
#tnote{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px;resize:vertical}
#toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:12px;width:min(92vw,440px);padding:8px 8px 8px 16px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.3);transform:translate(-50%,140%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s ease}
#toast.open{transform:translate(-50%,0);opacity:1}
#toast span{flex:1;font-weight:600}
#toast button{font:inherit;font-weight:800;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#f2b705;color:#1a1400;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0);transition:background .25s ease}
.modal.open{background:rgba(0,0,0,.45)}
.sheet{width:100%;max-width:380px;background:var(--card);color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35);opacity:0;transform:translateY(16px) scale(.96);transition:opacity .25s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.modal.open .sheet{opacity:1;transform:none}
.sheet h3{margin:0 0 6px;font-size:21px;line-height:1.2}.sheet p{margin:0 0 16px;color:var(--muted)}
.mbtns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.mok{background:var(--go);border-color:var(--go);color:#fff}.mdanger{background:#d93025;border-color:#d93025;color:#fff}
.top h2{flex:1}
.more{flex:none;width:44px;height:44px;margin:-6px -6px 0 0;align-self:flex-start;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1)}.more:active{transform:scale(.92);transition-duration:.08s}
.addnew{width:100%;margin-top:12px;background:var(--card);border-style:dashed}
.sync{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0;min-height:1em}
.form h2{margin:0 0 12px;font-size:26px;line-height:1.1}
.fl{display:block;margin-bottom:12px}.fl span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fl input,.fl textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.fl textarea{resize:vertical}.fl input:focus,.fl textarea:focus{outline:3px solid var(--map);outline-offset:0}
.fl small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.err{color:#d93025;font-weight:600;min-height:1em;margin:4px 0 8px}
.btn.save{width:100%;background:var(--go);border-color:var(--go);color:#fff;font-size:18px}
.btn.del{width:100%;margin-top:10px;background:transparent;border-color:#d93025;color:#d93025}
/* ===== Плавность ===== */
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.97)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.enter{animation:enter .7s cubic-bezier(.22,1,.36,1)}
#detail.show{animation:slidein .55s cubic-bezier(.22,1,.36,1)}
#home.show{animation:enter .55s cubic-bezier(.22,1,.36,1)}
.min,.btn,.tog,.tb,.row,.addr{transition:transform .25s cubic-bezier(.22,1,.36,1),background-color .3s ease,opacity .3s ease}
.min:active,.btn:active,.tog:active,.tb:active,.addr:active{transform:scale(.96);transition-duration:.08s}
.item{transition:box-shadow .2s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="cond">Keer Noon Club</h1>
  <span id="hdr" class="hdr"></span>
</header>
<div id="timers" aria-live="polite"></div>
<main id="delivery">
  <div id="home">
    <div class="sec cond"><span>Следующий</span></div>
    <div id="next"></div>
    <div class="sec cond" id="bar"></div>
    <ul id="list" class="list"></ul>
    <button class="btn addnew" data-act="add">＋ Добавить клиента</button>
    <div class="backup"><button class="btn" data-act="export">💾 Сохранить копию</button><label class="btn">📂 Восстановить<input type="file" id="importFile" accept=".json,application/json" hidden></label></div>
    <p id="syncNote" class="sync"></p>
  </div>
  <div id="detail"></div>
</main>
<main id="kitchen" hidden></main>
<main id="pack" hidden></main>
<nav id="tabs"><button class="tab" data-tab="delivery"><span>🚗</span>Доставка</button><button class="tab" data-tab="kitchen"><span>🍳</span>Кухня</button><button class="tab" data-tab="pack"><span>📦</span>Фасовка</button></nav>
<script>
{
// ===== СПИСОК КОНТАКТОВ =====
// name — в приложении, greet — имя в сообщении
// contact: @ник → Telegram, +номер → WhatsApp; несколько — массивом
// Запасной список (если база недоступна). Основные данные — в базе страницы.
const DEFAULT = []; // данные клиентов НЕ хранятся в коде — только на телефоне
let CONTACTS = DEFAULT.map(p => ({...p}));

const defOrder = () => CONTACTS.map(p => p.name);
// если на телефоне сохранились кириллические имена — вернуть к латинице
const RENAME = {"Анастасия": "Anastasia", "Вова": "Vova", "Анна": "Ann", "Роман": "Roman", "Оксем": "Oksem", "Виктория": "Viktoria", "Андрей": "Andrew", "Катрин": "Katrin"};
// Парковка
// Парковка и начальник — тоже НЕ в коде: хранятся на телефоне и в файле-копии
const SKEY = "knc-settings-v1";
let SETTINGS = {};
try { SETTINGS = JSON.parse(localStorage.getItem(SKEY) || "{}") || {}; } catch (e) {}
const saveSettings = () => { try { localStorage.setItem(SKEY, JSON.stringify(SETTINGS)); } catch (e) {} };
const parkNav = () => SETTINGS.parkLat ? `https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=${SETTINGS.parkLat},${SETTINGS.parkLng}` : "";
const parkMap = () => SETTINGS.parkMap || (SETTINGS.parkLat ? `https://www.google.com/maps/search/?api=1&query=${SETTINGS.parkLat},${SETTINGS.parkLng}` : "");
function renderHeader() {
  const h = document.getElementById("hdr");
  h.innerHTML = (SETTINGS.parkCode || SETTINGS.parkLat ? `<a class="park" href="${esc(parkNav() || "#")}" target="_blank" rel="noopener"><small>🅿️ Парковка</small><b>${esc(SETTINGS.parkCode || "")}</b></a>` : "")
    + (SETTINGS.bossTg ? `<a class="boss" href="${esc(chatLink(SETTINGS.bossTg))}" target="_blank" rel="noopener"><span>💬</span><b>${esc(SETTINGS.bossName || SETTINGS.bossTg)}</b></a>` : "");
}
const MINUTES = [3, 5, 7, 10, 13, 15];
const KEY = "contacts-state-v1";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const contacts = p => [].concat(p.contact || []);
const plural = n => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? "минуту" : a >= 2 && a <= 4 && (b < 12 || b > 14) ? "минуты" : "минут"; };
// ===== Варианты сообщений (n — имя, t — «5 минут») =====
const TEMPLATES = [
  (n, t) => `${n}, здравствуйте! Еду к вам с заказом, буду примерно через ${t}.`,
  (n, t) => `Здравствуйте, ${n}! Ваш заказ уже в пути — буду у вас примерно через ${t}.`,
  (n, t) => `${n}, здравствуйте! Направляюсь к вам, ориентировочно буду через ${t}.`,
  (n, t) => `Здравствуйте, ${n}! Буду у вас примерно через ${t}, ожидайте, пожалуйста.`,
  (n, t) => `${n}, здравствуйте! Уже еду в вашу сторону, буду примерно через ${t}. До встречи!`,
  (n, t) => `Здравствуйте, ${n}! Везу ваш заказ, прибуду примерно через ${t}.`,
  (n, t) => `${n}, здравствуйте! Подъезжаю к вам, буду примерно через ${t}.`,
  (n, t) => `Здравствуйте, ${n}! Сообщаю, что буду у вас с заказом примерно через ${t}.`,
  (n, t) => `${n}, здравствуйте! Ваш заказ едет к вам — буду примерно через ${t}.`,
  (n, t) => `Здравствуйте, ${n}! Еду к вам, буду примерно через ${t}.`,
  (n, t) => `${n}, здравствуйте! Ваш заказ уже в дороге, буду примерно через ${t}.`,
  (n, t) => `Здравствуйте, ${n}! Я уже в пути к вам, рассчитываю быть через ${t}.`
];
// ===== «Я на месте» — короткие варианты =====
const ARRIVE = [
  n => `${n}, я на месте.`,
  n => `${n}, я прибыл.`,
  n => `${n}, я на месте, жду вас.`,
  n => `${n}, я подъехал.`,
  n => `${n}, я у вашего дома.`,
  n => `${n}, прибыл, ожидаю вас.`,
  n => `${n}, я внизу.`,
  n => `${n}, я на месте с вашим заказом.`
];
let lastTpl = -1;
const pickTpl = () => { let k; do { k = Math.floor(Math.random() * TEMPLATES.length); } while (k === lastTpl && TEMPLATES.length > 1); lastTpl = k; return k; };
const message = (p, m, k) => TEMPLATES[k](p.greet || p.name, `${m} ${plural(m)}`);
// Ссылка на чат; если есть text — сообщение уже будет в поле ввода
const chatLink = (c, text) => {
  c = (c || "").trim();
  const t = text ? "?text=" + encodeURIComponent(text) : "";
  if (c.startsWith("@")) return "https://t.me/" + c.slice(1) + t;
  if (c.startsWith("+")) return "https://wa.me/" + c.replace(/\D/g, "") + t;
  if (c.startsWith("http")) return c;
  return null;
};
// Коды и номера квартир в заметке — крупно
const hl = t => esc(t).replace(/(\d{3,}|\b\d{1,3}[A-ZА-Я]\b)/g, "<strong>$1</strong>");
// Навигация: если в ссылке есть точные координаты — едем по ним, иначе по адресу
const navLink = p => {
  const m = (p.maps || "").match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  const dest = m ? m[1] + "," + m[2] : p.address;
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=" + encodeURIComponent(dest);
};
const app = c => c.startsWith("+") ? "WhatsApp" : "Telegram";
const mapsLink = p => p.maps || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.address);

let state = {order: defOrder(), hidden: [], today: {}};
try {
  const st = JSON.parse(localStorage.getItem(KEY) || "null");
  if (st && Array.isArray(st.order)) state = {order: st.order, hidden: Array.isArray(st.hidden) ? st.hidden : [], today: st.today && typeof st.today === "object" ? st.today : {}, done: Array.isArray(st.done) ? st.done : [], doneDay: st.doneDay || "", trip: st.trip && st.trip.name && Date.now() - st.trip.start < 6 * 3600000 ? st.trip : null};
} catch (e) {}
state.order = state.order.map(n => RENAME[n] || n);
state.hidden = state.hidden.map(n => RENAME[n] || n);
// Заметки на сегодня: хранятся с датой и сами исчезают на следующий день
const dayKey = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const todayNote = name => { const t = (state.today || {})[name]; return t && t.date === dayKey() ? t.text : ""; };
state.today = Object.fromEntries(Object.entries(state.today || {}).filter(([, t]) => t && t.date === dayKey()));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const isOff = p => state.hidden.includes(p.name);
// Доставленные за сегодня: остаются на своём месте со своим номером, утром сбрасываются
state.done = Array.isArray(state.done) ? state.done : [];
if (state.doneDay !== dayKey()) { state.done = []; state.doneDay = dayKey(); }
const isDone = p => state.done.includes(p.name);
function markDone(name) {
  const k = state.done.indexOf(name);
  if (k < 0) state.done.push(name); else state.done.splice(k, 1);
  state.doneDay = dayKey();
  save(); render();
}

function ordered() {
  const rank = n => { const k = state.order.indexOf(n); return k < 0 ? 999 : k; };
  return CONTACTS.map((p, i) => ({...p, i})).sort((a, b) => (isOff(a) - isOff(b)) || rank(a.name) - rank(b.name) || a.i - b.i);
}
function toggle(name) {
  const k = state.hidden.indexOf(name);
  if (k < 0) state.hidden.push(name); else state.hidden.splice(k, 1);
  save(); render();
}

// Карточка человека: адрес, заметка, кнопки минут, отметка
function panel(p) {
  const cs = contacts(p), main = cs[0];
  const off = isOff(p), dn = isDone(p);
  const k = pickTpl();
  return `<div class="panel">
    <div class="top"><span class="av">${(() => { const n = ordered().filter(x => !isOff(x)).findIndex(x => x.name === p.name) + 1; return n ? n : esc((p.name[0] || "?").toUpperCase()); })()}</span><h2 class="cond">${esc(p.name)}</h2><button class="more pinbtn" data-act="today" data-n="${esc(p.name)}" aria-label="Заметка на сегодня">📌</button><button class="more" data-act="edit" data-n="${esc(p.name)}" aria-label="Изменить данные ${esc(p.name)}">⋯</button></div>
    ${p.address ? `<div class="addrrow"><a class="addr" href="${esc(navLink(p))}" target="_blank" rel="noopener"><span class="ic">🧭</span><span><small>Поехали · навигация</small><b>${esc(p.address)}</b></span></a><a class="pin" href="${esc(mapsLink(p))}" target="_blank" rel="noopener" aria-label="Место на карте">📍<small>карта</small></a></div>` : ""}
    ${todayNote(p.name) ? `<button class="today" data-act="today" data-n="${esc(p.name)}"><small>📌 Сегодня</small>${esc(todayNote(p.name))}</button>` : ""}
    ${p.note ? `<div class="note">${hl(p.note)}</div>` : ""}
    ${main ? `<div class="lbl">✉ Через сколько минут буду — откроется ${app(main)} с текстом${cs.length > 1 ? " для " + esc(main) : ""}</div>
    <div class="prev"><span>${esc(TEMPLATES[k](p.greet || p.name, "… минут"))}</span><button class="shuf" data-act="shuffle" aria-label="Другой вариант">🔀</button></div>
    <div class="mins">${MINUTES.map(m => `<a class="min" data-text="${esc(message(p, m, k))}" href="${esc(chatLink(main, message(p, m, k)))}" target="_blank" rel="noopener"><b>${m}</b><small>мин</small></a>`).join("")}</div>` : ""}
    ${main ? (() => { const t = ARRIVE[Math.floor(Math.random() * ARRIVE.length)](p.greet || p.name); return `<a class="arrive" data-text="${esc(t)}" href="${esc(chatLink(main, t))}" target="_blank" rel="noopener"><b>🏁 Я на месте</b><small>${esc(t)}</small></a>`; })() : ""}
    <div class="btns">
      <div class="two">
        ${main ? `<a class="btn" href="${esc(chatLink(main))}" target="_blank" rel="noopener">💬 Чат</a>` : ""}
        ${off ? `<button class="btn done" data-act="tog" data-n="${esc(p.name)}">↩ Вернуть в маршрут</button>` : `<button class="btn done" data-act="deliver" data-n="${esc(p.name)}">${dn ? "↩ Не доставлено" : "✓ Доставлено"}</button>`}
      </div>
      ${cs.slice(1).map(c => `<a class="btn" href="${esc(chatLink(c))}" target="_blank" rel="noopener">💬 Второй контакт · ${esc(c)}</a>`).join("")}
    </div>
  </div>`;
}

const home = document.getElementById("home"), detail = document.getElementById("detail");
const next = document.getElementById("next"), bar = document.getElementById("bar"), list = document.getElementById("list");
let openName = null;
let editing = null; // имя редактируемого или "" для нового
let drag = null;

// Запоминаем, где был каждый человек, чтобы плавно переехать на новое место
let lastNext = null;
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function snapshot() {
  const m = {};
  list.querySelectorAll(".item").forEach(li => m[li.dataset.n] = {top: li.getBoundingClientRect().top, off: li.classList.contains("off") || li.classList.contains("delivered")});
  return m;
}
function animateList(before) {
  if (reduce) return;
  list.querySelectorAll(".item").forEach(li => {
    const b = before[li.dataset.n];
    if (!b) return;
    const dy = b.top - li.getBoundingClientRect().top;
    const nowOff = li.classList.contains("off") || li.classList.contains("delivered");
    if (!dy && b.off === nowOff) return;
    li.style.transition = "none";
    li.style.transform = `translateY(${dy}px)`;
    if (b.off !== nowOff) li.style.opacity = b.off ? ".4" : "1";
    li.getBoundingClientRect(); // применить начальное положение
    li.style.transition = "transform .75s cubic-bezier(.22,1,.36,1), opacity .75s ease";
    li.style.transform = "";
    li.style.opacity = "";
    li.addEventListener("transitionend", () => { li.style.transition = ""; }, {once: true});
  });
}

function render() {
  const before = snapshot();
  const all = ordered();
  const route = all.filter(p => !isOff(p));          // сегодняшний маршрут, с номерами
  const active = route.filter(p => !isDone(p));      // кого ещё везти
  const offCount = all.length - route.length;
  next.innerHTML = !all.length ? `<div class="panel empty welcome"><div style="font-size:44px">📦</div><h2 class="cond">Список пуст</h2><p>Нажми «📂 Восстановить» внизу и выбери файл с контактами — или добавь клиента вручную.</p></div>` : active.length ? panel(active[0]) : `<div class="panel finish">
      <div class="big">🎉</div>
      <h2 class="cond">Маршрут завершён!</h2>
      <p>Все доставлено. Отличная работа!</p>
      ${SETTINGS.parkLat ? `<div class="addrrow"><a class="addr" href="${esc(parkNav())}" target="_blank" rel="noopener"><span class="ic">🅿️</span><span><small>Поехали · навигация</small><b>Парковка${SETTINGS.parkCode ? " · код " + esc(SETTINGS.parkCode) : ""}</b></span></a><a class="pin" href="${esc(parkMap())}" target="_blank" rel="noopener" aria-label="Парковка на карте">📍<small>карта</small></a></div>` : ""}
      <button class="btn" data-act="restart">↺ Начать новый маршрут</button>
    </div>`;
  const nextName = active.length ? active[0].name : "";
  if (nextName !== lastNext && lastNext !== null) next.firstElementChild.classList.add("enter");
  lastNext = nextName;
  const def = defOrder();
  const changed = route.map(p => p.name).join() !== def.filter(n => !state.hidden.includes(n)).join();
  bar.innerHTML = `<span>Маршрут · доставлено ${route.length - active.length} из ${route.length}</span>${changed ? `<button class="tb" data-act="reset">↺ Исходный порядок</button>` : ""}${offCount ? `<button class="tb" data-act="showall">Вернуть всех</button>` : ""}`;
  const firstActive = active.length ? active[0].name : null;
  list.innerHTML = all.map(p => {
    const off = isOff(p), dn = isDone(p);
    const num = route.indexOf(p) + 1;
    return `<li class="item${off ? " off" : ""}${dn ? " delivered" : ""}${p.name === firstActive ? " first" : ""}" data-n="${esc(p.name)}">
      <button class="row" data-open="${esc(p.name)}"><span class="av">${off ? "–" : dn ? `<i>${num}</i>✓` : num}</span>
        <span><div class="nm">${esc(p.name)}${p.note ? `<span class="flag">🔑 код</span>` : ""}${todayNote(p.name) ? `<span class="flag fl2">📌 сегодня</span>` : ""}</div><div class="sub">${esc(p.address || contacts(p).join(", "))}</div></span></button>
      ${dn ? `<button class="tog" data-act="deliver" data-n="${esc(p.name)}" aria-label="Не доставлено ${esc(p.name)}">↩</button>` : `<button class="tog" data-act="tog" data-n="${esc(p.name)}" aria-label="${off ? "Вернуть" : "Убрать из маршрута"} ${esc(p.name)}">${off ? "↩" : "✓"}</button>`}
      ${off || dn ? "" : `<button class="handle" aria-label="Перетащить ${esc(p.name)}">⠿</button>`}
    </li>`;
  }).join("");
  if (!drag) animateList(before);
  if (openName && editing === null) {
    const p = all.find(x => x.name === openName);
    detail.innerHTML = `<button class="back" data-act="back">← Назад к маршруту</button>${p ? panel(p) : ""}`;
  }
}

// ===== Окно подтверждения =====
function confirmBox(title, text, okLabel, danger) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "modal";
    wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h3 id="mt">${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ""}
      <div class="mbtns"><button class="btn" data-m="no">Отмена</button><button class="btn ${danger ? "mdanger" : "mok"}" data-m="yes">${esc(okLabel)}</button></div>
    </div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add("open"));
    const close = v => { wrap.classList.remove("open"); setTimeout(() => wrap.remove(), 250); resolve(v); };
    wrap.addEventListener("click", e => {
      const b = e.target.closest("[data-m]");
      if (b) { e.stopPropagation(); close(b.dataset.m === "yes"); }
      else if (e.target === wrap) close(false);
    });
    wrap.querySelector("[data-m=yes]").focus();
  });
}

// ===== Заметка на сегодня =====
const PRESETS = ["💶 Взять оплату", "💳 Оплата картой / MB Way", "💵 Наличные, нужна сдача", "✅ Уже оплачено", "Оставить у двери", "Позвонить заранее", "Не звонить в домофон", "Передать лично в руки", "Приехать позже"];
function todayBox(name) {

  wrap.addEventListener("click", e => {

}

// ===== Машинка в пути =====
// state.trip = {name, start, mins, arrived}
const tripOf = name => state.trip && state.trip.name === name ? state.trip : null;
function tripPct(t) {
  if (t.arrived) return 100;
  const p = (Date.now() - t.start) / (t.mins * 60000) * 100;
  return Math.max(0, Math.min(94, p)); // до «Я на месте» стоит чуть перед домом
}
function etaText(t) {
  if (t.arrived) return "на месте ✓";
  const left = Math.ceil((t.start + t.mins * 60000 - Date.now()) / 60000);
  return left > 0 ? `≈ ${left} мин` : "почти на месте";
}
function roadHTML(name) {
  const t = tripOf(name);
  if (!t) return "";
  const pct = tripPct(t);
  return `<div class="road${t.arrived ? " arrived" : ""}" data-trip="${esc(name)}">
    <span class="home">🏠</span>
    <div class="track"><span class="car" style="left:${100 - pct}%;transform:translateX(-${100 - pct}%)"><svg viewBox="0 0 64 30" width="52" height="25" aria-hidden="true"><path d="M3 21 L4 15 Q6 11 12 9.5 L19 3.5 Q21 2 25 2 L56 2 Q60 2 61 6 L62 20 Q62 23 59 23 L5 23 Q3 23 3 21Z" fill="#111"/><path d="M20 4.2 L13.5 9.6 L24 9.6 L24 4.2Z M26 4.2 L26 9.6 L38 9.6 L38 4.2Z M40 4.2 L40 9.6 L51 9.6 L51 4.2Z M53 4.2 L53 9.6 L59.5 9.6 L59 5 Q58.6 4.2 57.5 4.2Z" fill="#8fb3d9" opacity=".9"/><rect x="24" y="0.6" width="30" height="1.4" rx=".7" fill="#555"/><rect x="5" y="15" width="3" height="2" rx="1" fill="#ffe8a3"/><rect x="59" y="13" width="2.4" height="3" rx="1" fill="#d33"/><line x1="25" y1="12" x2="25" y2="21" stroke="#2a2a2a" stroke-width=".8"/><line x1="39" y1="12" x2="39" y2="21" stroke="#2a2a2a" stroke-width=".8"/><circle cx="14" cy="23" r="5" fill="#222"/><circle cx="14" cy="23" r="2.3" fill="#aaa"/><circle cx="51" cy="23" r="5" fill="#222"/><circle cx="51" cy="23" r="2.3" fill="#aaa"/></svg></span></div>
    <span class="eta">${etaText(t)}</span>
  </div>`;
}
function tickRoads() {
  document.querySelectorAll(".road").forEach(r => {
    const t = tripOf(r.dataset.trip);
    if (!t) return;
    const pct = tripPct(t);
    const car = r.querySelector(".car");
    car.style.left = (100 - pct) + "%";
    car.style.transform = `translateX(-${100 - pct}%)`;
    r.querySelector(".eta").textContent = etaText(t);
    r.classList.toggle("arrived", !!t.arrived);
  });
}
// машинка отключена
function startTrip(name, mins) { state.trip = {name, start: Date.now(), mins: +mins, arrived: false}; save(); setTimeout(() => { render(); }, 50); }
function arriveTrip(name) {
  if (!state.trip || state.trip.name !== name) state.trip = {name, start: Date.now() - 60000, mins: 1, arrived: false};
  state.trip.arrived = true; save();
  tickRoads();
}

// ===== Праздник: конфетти и короткая мелодия =====
const COLORS = ["#64001b", "#f3ece0", "#138a3c", "#f2b705", "#1a62d6", "#e0457b", "#e8590c"];
function confetti(x, y, count, spread) {
  if (reduce) return;
  const box = document.createElement("div");
  box.className = "confetti";
  document.body.appendChild(box);
  for (let i = 0; i < count; i++) {
    const c = document.createElement("i");
    const size = 6 + Math.random() * 7;
    c.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size * (Math.random() < .5 ? 1 : .45)}px;background:${COLORS[i % COLORS.length]};border-radius:${Math.random() < .3 ? "50%" : "2px"}`;
    box.appendChild(c);
    const ang = -Math.PI / 2 + (Math.random() - .5) * spread;
    const v = 140 + Math.random() * 260;
    const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v;
    c.animate([
      {transform: "translate(0,0) rotate(0deg)", opacity: 1},
      {transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .45},
      {transform: `translate(${dx * 1.3}px,${dy + 380}px) rotate(${Math.random() * 720}deg)`, opacity: 0}
    ], {duration: 1300 + Math.random() * 900, easing: "cubic-bezier(.2,.7,.4,1)", fill: "forwards"});
  }
  setTimeout(() => box.remove(), 2600);
}
let actx = null;
function chime(notes) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    notes.forEach(([f, at, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0 + at);
      g.gain.linearRampToValueAtTime(.18, t0 + at + .02);
      g.gain.exponentialRampToValueAtTime(.001, t0 + at + len);
      o.connect(g).connect(actx.destination);
      o.start(t0 + at); o.stop(t0 + at + len + .05);
    });
  } catch (e) {}
}
// «Вуш» — мягкий шум с уходящей вверх частотой
function whoosh() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime, dur = .35;
    const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t0);
    f.frequency.exponentialRampToValueAtTime(2600, t0 + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(.35, t0 + .08);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    src.connect(f).connect(g).connect(actx.destination);
    src.start(t0); src.stop(t0 + dur + .02);
  } catch (e) {}
}
function checkFinish() {
  const route = CONTACTS.filter(p => !state.hidden.includes(p.name));
  if (route.length && state.done.length && route.every(p => state.done.includes(p.name))) { setTimeout(bigCelebrate, 250); window.scrollTo({top: 0, behavior: "smooth"}); }
}
function celebrate(btn) {
  const r = btn.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 36, 1.6);
  chime([[784, 0, .18], [1047, .12, .35]]);
}
function bigCelebrate() {
  const w = window.innerWidth;
  confetti(w * .2, window.innerHeight * .35, 70, 1.4);
  setTimeout(() => confetti(w * .8, window.innerHeight * .35, 70, 1.4), 180);
  setTimeout(() => confetti(w * .5, window.innerHeight * .25, 90, 2.2), 380);
  chime([[523, 0, .2], [659, .15, .2], [784, .3, .2], [1047, .45, .6], [784, .75, .15], [1047, .9, .8]]);
}

// ===== Отмена последнего действия =====
let undoSnap = null, undoTimer = null;
function remember(label) {
  undoSnap = JSON.stringify({order: state.order, hidden: state.hidden, done: state.done});
  showToast(label);
}
function showToast(label, canUndo) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(label)}</span>${canUndo === false || (canUndo === undefined && !undoSnap) ? "" : `<button data-act="undo">Отменить</button>`}`;
  requestAnimationFrame(() => t.classList.add("open"));
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { t.classList.remove("open"); undoSnap = null; }, 6000);
}
function undo() {
  if (!undoSnap) return;
  const u = JSON.parse(undoSnap);
  state.order = u.order; state.hidden = u.hidden; if (u.done) state.done = u.done; undoSnap = null;
  save(); render();
  const t = document.getElementById("toast"); if (t) t.classList.remove("open");
  clearTimeout(undoTimer);
}

// ===== Редактирование контактов =====
const placeFromLink = url => { const m = (url || "").match(/\/maps\/place\/([^/@?]+)/); return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; };
function formHTML(p) {
  const isNew = !p; p = p || {};
  const f = (id, label, val, hint, multi) => `<label class="fl"><span>${label}</span>${multi ? `<textarea id="${id}" rows="3">${esc(val || "")}</textarea>` : `<input id="${id}" value="${esc(val || "")}" autocomplete="off">`}${hint ? `<small>${hint}</small>` : ""}</label>`;
  return `<button class="back" data-act="cancel">← Отмена</button>
  <form class="panel form" id="cform">
    <h2 class="cond">${isNew ? "Новый клиент" : "Изменить · " + esc(p.name)}</h2>
    ${f("f_name", "Имя в приложении *", p.name, "Например: Maria")}
    ${f("f_greet", "Имя в сообщении", p.greet, "Как обращаться: Мария. Пусто — как в приложении")}
    ${f("f_contact", "Telegram или телефон", contacts(p).join("\n"), "@ник или +351… Несколько — каждый с новой строки", true)}
    ${f("f_maps", "Ссылка Google Maps", p.maps, "Вставь ссылку «Поделиться» из Google Maps")}
    ${f("f_address", "Адрес", p.address, "Можно пусто — возьму из ссылки")}
    ${f("f_note", "Заметка: код, квартира, вход", p.note, "", true)}
    <p class="err" id="ferr"></p>
    <button class="btn save" type="submit">💾 Сохранить</button>
    ${isNew ? "" : `<button class="btn del" type="button" data-act="del" data-n="${esc(p.name)}">🗑 Удалить клиента</button>`}
  </form>`;
}
function openForm(name) {
  editing = name;
  const p = name ? CONTACTS.find(x => x.name === name) : null;
  openName = name || "__form__";
  home.style.display = "none"; detail.style.display = "block";
  detail.innerHTML = formHTML(p);
  detail.classList.remove("show"); void detail.offsetWidth; detail.classList.add("show");
  window.scrollTo(0, 0);
}
function closeForm(showName) {
  editing = null;
  if (showName) { openName = null; openDetail(showName); } else closeDetail();
}
async function submitForm() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById("ferr");
  const name = v("f_name");
  if (!name) { err.textContent = "Впиши имя"; return; }
  if (CONTACTS.some(x => x.name === name && x.name !== editing)) { err.textContent = "Такое имя уже есть — добавь букву или цифру"; return; }
  const cs = v("f_contact").split(/\n+/).map(x => x.trim()).filter(Boolean).map(x => /^[A-Za-z0-9_]{4,}$/.test(x) ? "@" + x : x);
  const maps = v("f_maps");
  const address = v("f_address") || placeFromLink(maps);
  if (!address && !maps) { err.textContent = "Нужен адрес или ссылка на карту"; return; }
  const p = {name};
  if (v("f_greet")) p.greet = v("f_greet");
  if (cs.length) p.contact = cs.length === 1 ? cs[0] : cs;
  if (address) p.address = address;
  if (maps) p.maps = maps;
  if (v("f_note")) p.note = v("f_note");
  const old = editing;
  if (old && !(await confirmBox("Сохранить изменения?", `Данные клиента ${old}${old !== name ? " → " + name : ""} будут заменены.`, "Да, сохранить"))) return;
  const next = CONTACTS.map(x => ({...x}));
  if (old) {
    const k = next.findIndex(x => x.name === old); next[k] = p;
    state.order = state.order.map(n => n === old ? name : n);
    state.hidden = state.hidden.map(n => n === old ? name : n);
    state.done = state.done.map(n => n === old ? name : n);
    if (state.today && state.today[old] && old !== name) { state.today[name] = state.today[old]; delete state.today[old]; }
  } else {
    next.push(p);
  }
  const ok = await saveContacts(next, err);
  if (!ok) return;
  save();
  closeForm(name);
}
async function deleteContact(btn) {
  const name = btn.dataset.n;
  if (!(await confirmBox(`Удалить ${name}?`, "Клиент пропадёт из списка. Это нельзя отменить.", "Да, удалить", true))) return;
  const ok = await saveContacts(CONTACTS.filter(x => x.name !== name), document.getElementById("ferr"));
  if (!ok) return;
  state.order = state.order.filter(n => n !== name); state.hidden = state.hidden.filter(n => n !== name); state.done = state.done.filter(n => n !== name); if (state.today) delete state.today[name]; save();
  editing = null; closeDetail();
}

// ===== Копия контактов: сохранить / восстановить =====
function exportBackup() {
  const data = JSON.stringify({app: "knc", savedAt: new Date().toISOString(), settings: SETTINGS, list: CONTACTS}, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));
  const d = new Date();
  a.download = `knc-kontakty-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  showToast("Копия сохранена в Загрузки", false);
}
document.addEventListener("change", async e => {
  if (e.target.id !== "importFile" && e.target.id !== "importRecipes") return;
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j && Array.isArray(j.recipes)) { try { await importRecipes(j); } catch (er) { showToast("В файле ошибка в техкартах", false); } return; }
    if (e.target.id === "importRecipes") throw 0;
    const list = Array.isArray(j) ? j : j.list;
    if (!Array.isArray(list) || !list.every(p => p && typeof p.name === "string")) throw 0;
    if (CONTACTS.length && !(await confirmBox("Заменить список?", `Сейчас клиентов: ${CONTACTS.length}. В файле: ${list.length}. Текущий список заменится.`, "Да, заменить"))) return;
    await saveContacts(list.map(p => ({...p})));
    if (j.settings && typeof j.settings === "object") { SETTINGS = {...j.settings}; saveSettings(); renderHeader(); }
    state.order = list.map(p => p.name); state.hidden = []; save(); render();
    showToast(`Загружено клиентов: ${list.length}`, false);
  } catch (err) {
    showToast(e.target.id === "importRecipes" ? "Это не файл с техкартами" : "Это не файл с контактами", false);
  }
});

function openDetail(name) { openName = name; home.style.display = "none"; home.classList.remove("show"); detail.style.display = "block"; detail.classList.remove("show"); void detail.offsetWidth; detail.classList.add("show"); render(); window.scrollTo(0, 0); }
function closeDetail() { openName = null; detail.style.display = "none"; detail.innerHTML = ""; home.style.display = ""; home.classList.remove("show"); void home.offsetWidth; home.classList.add("show"); render(); }

// Копируем сообщение и только потом открываем чат
function copyFallback(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-100px;opacity:0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}
async function copyAndGo(a) {
  const text = a.dataset.text;
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = copyFallback(text); }
  showToast(ok ? "📋 Текст уже в чате — и на всякий случай скопирован" : "Не удалось скопировать", false);
  a.classList.add("copied");
  setTimeout(() => a.classList.remove("copied"), 1200);
  // Telegram: прямая ссылка приложения tg:// — лучше подставляет текст, когда Telegram уже открыт в фоне
  const m = a.href.match(/^https:\/\/t\.me\/([A-Za-z0-9_]+)\?text=(.*)$/);
  setTimeout(() => {
    if (m) { location.href = `tg://resolve?domain=${m[1]}&text=${m[2]}`; return; }
    const w = window.open(a.href, "_blank"); if (!w) location.href = a.href;
  }, 250);
}

document.addEventListener("click", e => {
  if (justDragged && e.target.closest("#list")) { e.preventDefault(); return; }
  const ct = e.target.closest("a[data-text]");
  if (ct) { e.preventDefault(); copyAndGo(ct); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    // ✓ в списке — убрать из сегодняшнего маршрута (вуш)
    if (a.dataset.act === "tog") {
      const n = a.dataset.n, removing = !state.hidden.includes(n);
      remember(removing ? `${n} убран из маршрута` : `${n} возвращён в маршрут`);
      if (removing) whoosh();
      toggle(n);
      if (openName) closeDetail();
      checkFinish();
    }
    // «Доставлено» — остаётся на своём месте со своим номером
    if (a.dataset.act === "deliver") {
      const n = a.dataset.n, delivering = !state.done.includes(n);
      remember(delivering ? `${n} · доставлено` : `${n} · снова в маршруте`);
      if (delivering) celebrate(a);
      if (delivering && state.trip && state.trip.name === n) state.trip = null;
      markDone(n);
      if (openName) closeDetail();
      if (delivering) checkFinish();
    }
    if (a.dataset.act === "showall") { remember("Все возвращены"); state.hidden = []; save(); render(); }
    if (a.dataset.act === "undo") undo();
    if (a.dataset.act === "export") exportBackup();
    if (a.dataset.act === "trip") startTrip(a.dataset.n, a.dataset.m);
    if (a.dataset.act === "arrived") arriveTrip(a.dataset.n);
    if (a.dataset.act === "today") todayBox(a.dataset.n);
    if (a.dataset.act === "shuffle") { render(); const nb = openName ? detail.querySelector(".panel") : next.querySelector(".panel"); if (nb) nb.querySelector(".prev").animate?.([{opacity: .3}, {opacity: 1}], {duration: 300}); }
    if (a.dataset.act === "reset") { remember("Порядок сброшен"); state.order = defOrder(); save(); render(); }
    if (a.dataset.act === "restart") { remember("Маршрут начат заново"); state.order = defOrder(); state.hidden = []; state.done = []; save(); render(); }
    if (a.dataset.act === "back") closeDetail();
    if (a.dataset.act === "edit") openForm(a.dataset.n);
    if (a.dataset.act === "add") openForm("");
    if (a.dataset.act === "cancel") closeForm(editing || null);
    if (a.dataset.act === "del") deleteContact(a);
    return;
  }
  if (editing !== null) return;
  const r = e.target.closest("[data-open]");
  if (r) openDetail(r.dataset.open);
});

// ===== Перетаскивание пальцем за ⠿ =====
// Удержи палец ~0,4 с на строке (или на ⠿) — строка «поднимется», и её можно тянуть
const HOLD_MS = 400;
let pending = null, justDragged = false;
list.addEventListener("pointerdown", e => {
  const li = e.target.closest(".item");
  if (!li || li.classList.contains("off") || li.classList.contains("delivered") || e.target.closest(".tog")) return;
  if (e.target.closest(".handle")) e.preventDefault();
  const id = e.pointerId, x0 = e.clientX, y0 = e.clientY, src = e.target;
  li.classList.add("holding");
  pending = {li, id, x0, y0, timer: setTimeout(() => {
    li.classList.remove("holding");
    try { src.setPointerCapture(id); } catch (err) {}
    li.classList.add("drag");
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (err) {}

const cancelPending = () => { if (pending) { clearTimeout(pending.timer); pending.li.classList.remove("holding"); pending = null; } };
// пока тянем — не даём странице прокручиваться
list.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, {passive: false});

list.addEventListener("pointermove", e => {
  if (pending && e.pointerId === pending.id) {
    pending.y = e.clientY;
    if (Math.abs(e.clientX - pending.x0) > 8 || Math.abs(e.clientY - pending.y0) > 8) cancelPending();
    return;
  }
  if (!drag || e.pointerId !== drag.id) return;
  const {li} = drag, y = e.clientY;
  const ok = el => el && el.classList.contains("item") && !el.classList.contains("off") && !el.classList.contains("delivered");
  const prev = li.previousElementSibling, nx = li.nextElementSibling;

    el.style.transform = "";

  // сравниваем с «настоящим» местом соседа (без анимации), чтобы не дёргалось
  const py = y + window.scrollY - list.getBoundingClientRect().top - window.scrollY + list.offsetTop;
  const mid = el => el.offsetTop + el.offsetHeight / 2;
  if (ok(nx) && py > mid(nx)) slide(nx, () => list.insertBefore(nx, li));
  else if (ok(prev) && py < mid(prev)) slide(prev, () => list.insertBefore(prev, li.nextElementSibling));

document.addEventListener("submit", e => { if (e.target.id === "cform") { e.preventDefault(); submitForm(); } });

// ================= КУХНЯ =================
// Техкарты хранятся только на телефоне (загружаются из файла), в коде их нет.
const RKEY = "knc-recipes-v1", KSKEY = "knc-kitchen-v1", TKEY = "knc-timers-v1";
let RECIPES = [];
try { const r = JSON.parse(localStorage.getItem(RKEY) || "null"); if (Array.isArray(r)) RECIPES = r; } catch (e) {}
let KS = {portions: {}, checks: {}, step: {}, done: {}};
try { const k = JSON.parse(localStorage.getItem(KSKEY) || "null"); if (k && typeof k === "object") KS = {portions: k.portions || {}, checks: k.checks || {}, step: k.step || {}, done: k.done || {}, open: k.open || null}; } catch (e) {}
const saveKS = () => { try { localStorage.setItem(KSKEY, JSON.stringify(KS)); } catch (e) {} };
const saveRecipes = () => { try { localStorage.setItem(RKEY, JSON.stringify(RECIPES)); } catch (e) {} };

const kitchen = document.getElementById("kitchen");
let kOpen = KS.open || null;      // id открытой техкарты (помним между запусками)
let kCook = false;     // режим готовки (по шагам)

// --- числа ---
const portionsOf = r => KS.portions[r.id] || r.base;
const factorOf = r => portionsOf(r) / r.base;
function fmtAmount(v, unit) {
  if (unit === "шт") return Math.max(1, Math.round(v)) + " шт";
  const u = unit || "г";
  if (v < 10) return String(Math.round(v * 10) / 10).replace(".", ",") + " " + u;
  const n = Math.round(v);
  return (n >= 1000 ? n.toLocaleString("ru-RU") : String(n)) + " " + u;
}
function findItem(r, id) {
  for (const s of r.sections || []) for (const it of s.items || []) if (it.id === id) return it;
  return null;
}
// {id} — всё количество ингредиента, {id:b} — брутто, {50} — 50 г на базу, {3000:мл} — с единицей
function renderText(r, text) {
  const f = factorOf(r);
  return esc(text).replace(/\{([^}]+)\}/g, (m, key) => {
    const [k, mod] = key.split(":");
    if (/^\d+([.,]\d+)?$/.test(k)) return `<span class="amt">${fmtAmount(parseFloat(k.replace(",", ".")) * f, mod)}</span>`;
    const it = findItem(r, k);
    if (!it) return m;
    const base = mod === "b" && it.b ? it.b : it.g;
    return `<span class="amt">${fmtAmount(base * f, it.unit)}</span>`;
  });
}

// --- таймеры (считают от времени окончания, переживают закрытие приложения) ---
let TIMERS = [];
try { const t = JSON.parse(localStorage.getItem(TKEY) || "null"); if (Array.isArray(t)) TIMERS = t; } catch (e) {}
const saveTimers = () => { try { localStorage.setItem(TKEY, JSON.stringify(TIMERS)); } catch (e) {} };
const timersBar = document.getElementById("timers");
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (kCook || TIMERS.some(t => !t.ack))) keepAwake(true); });
function startTimer(label, min, rid, step) {
  const id = Date.now() + "" + Math.floor(Math.random() * 1000);
  TIMERS.push({id, label, rid, step, end: Date.now() + min * 60000, dur: min * 60000, ack: false, rang: false});
  saveTimers(); renderTimers(); keepAwake(true);
  try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  showToast(`⏱ ${label}: ${min} мин`, false);
}
const mmss = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function alarm() {
  chime([[880, 0, .25], [660, .3, .25], [880, .6, .25], [660, .9, .4]]);
  if (navigator.vibrate) try { navigator.vibrate([400, 150, 400, 150, 600]); } catch (e) {}
}
let timersSig = "";
function renderTimers() {
  const now = Date.now();
  const active = TIMERS.filter(t => !t.ack);
  timersBar.classList.toggle("show", active.length > 0);
  // Пересобираем кнопки только когда меняется набор таймеров или их состояние —
  // иначе просто обновляем цифры, чтобы нажатия не терялись
  const sig = active.map(t => t.id + (t.end <= now ? "R" : "")).join("|");
  if (sig !== timersSig) {
    timersSig = sig;
    timersBar.innerHTML = active.map(t => {
      const done = t.end <= now;
      return `<div class="tmr${done ? " ring" : ""}" data-k="tmr" data-id="${t.id}">
        <span class="tl">${esc(t.label)}</span><b>${done ? "Готово!" : mmss(t.end - now)}</b>
        ${done ? "" : `<button data-k="tplus" data-id="${t.id}" aria-label="Плюс минута">+1</button>`}
        <button data-k="tstop" data-id="${t.id}" aria-label="${done ? "Выключить" : "Отменить"}">${done ? "✓" : "✕"}</button>
      </div>`;
    }).join("");
  } else {
    for (const t of active) {
      const el = timersBar.querySelector(`.tmr[data-id="${t.id}"] b`);

    }
  }
}
function tickTimers() {
  const now = Date.now();
  let changed = false;
  for (const t of TIMERS) {
    if (!t.ack && t.end <= now) {
      // звенит каждые 4 секунды, пока не нажали ✓ (но не дольше 2 минут)
      if (!t.rang || (now - (t.lastRing || 0) > 4000 && now - t.end < 120000)) {
        alarm(); t.rang = true; t.lastRing = now; changed = true;
        if (document.visibilityState !== "visible") try { if ("Notification" in window && Notification.permission === "granted") new Notification("⏱ " + t.label + " — готово!", {tag: t.id}); } catch (e) {}
      }
    }

  if (!TIMERS.some(t => !t.ack) && !kCook) keepAwake(false);
}
setInterval(tickTimers, 500);

// --- экраны ---

  ${(r.sections || []).map(s => `<div class="panel ing"><h3>${esc(s.name)}</h3>${(s.items || []).map(it => {

// --- действия ---
function setPortions(r, n) {
  n = Math.max(1, Math.min(500, Math.round(n || r.base)));
  KS.portions[r.id] = n; saveKS(); renderKitchen();
}
kitchen.addEventListener("change", e => {
  if (e.target.id === "pnum") { const r = RECIPES.find(x => x.id === kOpen); if (r) setPortions(r, parseInt(e.target.value, 10)); }
});
kitchen.addEventListener("click", e => {
  const a = e.target.closest("[data-k]");
  if (!a) return;
  const k = a.dataset.k;
  const r = RECIPES.find(x => x.id === kOpen);
  if (k === "open") { kOpen = KS.open = a.dataset.id; saveKS(); kCook = false; renderKitchen(); window.scrollTo(0, 0); return; }
  if (k === "list") { kOpen = KS.open = null; saveKS(); kCook = false; renderKitchen(); window.scrollTo(0, 0); return; }
  if (k === "export") { exportRecipes(); return; }
  if (!r) return;
  if (k === "pminus") setPortions(r, portionsOf(r) - 1);
  if (k === "pplus") setPortions(r, portionsOf(r) + 1);
  if (k === "pbase") setPortions(r, r.base);
  if (k === "check") {
    const c = KS.checks[r.id] = KS.checks[r.id] || [];
    const j = c.indexOf(a.dataset.id); if (j < 0) c.push(a.dataset.id); else c.splice(j, 1);
    saveKS(); a.classList.toggle("on"); a.querySelector(".ck").textContent = j < 0 ? "✓" : "";
    return;
  }
  if (k === "uncheck") { KS.checks[r.id] = []; saveKS(); renderKitchen(); }
  if (k === "stepdone") {
    const d = KS.done[r.id] = KS.done[r.id] || [];
    const i = +a.dataset.step, j = d.indexOf(i); if (j < 0) d.push(i); else d.splice(j, 1);
    saveKS(); renderKitchen();
  }
  if (k === "resetsteps") { KS.done[r.id] = []; KS.step[r.id] = 0; saveKS(); renderKitchen(); }
  if (k === "timer") { startTimer(a.dataset.label, +a.dataset.min, r.id, +a.dataset.step); renderKitchen(); }
  if (k === "cook") {
    const d = KS.done[r.id] || [];
    let first = 0; while (d.includes(first) && first < r.steps.length - 1) first++;
    KS.step[r.id] = first; saveKS(); kCook = true; keepAwake(true); renderKitchen(); window.scrollTo(0, 0);
  }
  if (k === "cookexit") { kCook = false; renderKitchen(); window.scrollTo(0, 0); }
  if (k === "prev") { KS.step[r.id] = Math.max(0, (KS.step[r.id] || 0) - 1); saveKS(); renderKitchen(); }
  if (k === "next" || k === "finish") {
    const i = KS.step[r.id] || 0, d = KS.done[r.id] = KS.done[r.id] || [];
    if (!d.includes(i)) d.push(i);
    if (k === "next") { KS.step[r.id] = i + 1; saveKS(); renderKitchen(); window.scrollTo(0, 0); }
    else { saveKS(); kCook = false; celebrate(a); showToast("🍳 " + r.title + " — готово", false); renderKitchen(); window.scrollTo(0, 0); }
  }
});
timersBar.addEventListener("click", e => {
  const a = e.target.closest("[data-k]");
  if (!a) return;
  const t = TIMERS.find(x => x.id === a.dataset.id);
  if (!t) return;
  if (a.dataset.k === "tplus") { t.end += 60000; t.dur += 60000; }
  if (a.dataset.k === "tstop") { t.ack = true; TIMERS = TIMERS.filter(x => !x.ack); }
  if (a.dataset.k === "tmr" && t.rid) { switchTab("kitchen"); kOpen = KS.open = t.rid; kCook = true; KS.step[t.rid] = t.step; saveKS(); renderKitchen(); window.scrollTo(0, 0); }
  saveTimers(); renderTimers();

});
function exportRecipes() {
  const data = JSON.stringify({app: "knc", kind: "recipes", savedAt: new Date().toISOString(), recipes: RECIPES}, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], {type: "application/json"}));

async function importRecipes(j) {

// ================= ФАСОВКА =================
// Текст списка и галочки хранятся только на телефоне.
const PKEY = "knc-pack-v1";
let PACK = {text: "", checks: {}, view: "clients", open: null, savedAt: ""};
try { const pk = JSON.parse(localStorage.getItem(PKEY) || "null"); if (pk && typeof pk === "object") PACK = {...PACK, ...pk, checks: pk.checks || {}}; } catch (e) {}
const savePack = () => { try { localStorage.setItem(PKEY, JSON.stringify(PACK)); } catch (e) {} };
const packEl = document.getElementById("pack");
let packEditing = false;

// Разбор текста вида:
// Блюдо - Имя, Имя x2, Имя - 18
// NO ONIONS - Имя x2 - 2          ← строка БОЛЬШИМИ буквами = замена для блюда выше
function parsePack(text) {
  const dishes = [];
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    const parts = line.split(/\s+[-–—]\s+/);
    if (parts.length < 2) continue;
    let title = parts[0].trim(), namesPart = parts[1], stated = null;
    if (parts.length >= 3 && /^\d+$/.test(parts[parts.length - 1].trim())) { stated = +parts[parts.length - 1].trim(); namesPart = parts.slice(1, -1).join(" - "); }
    else namesPart = parts.slice(1).join(" - ");
    const people = namesPart.split(",").map(x => x.trim()).filter(Boolean).map(x => {
      const m = x.match(/^(.*?)\s*[x×х]\s*(\d+)$/i);
      return m ? {name: m[1].trim(), qty: +m[2]} : {name: x, qty: 1};
    }).filter(p => p.name && !/^\d+$/.test(p.name));
    const isMod = !/[a-zа-яё]/.test(title) && dishes.length; // нет строчных букв → замена
    if (isMod) dishes[dishes.length - 1].mods.push({mod: title, people, stated});
    else dishes.push({dish: title, people, stated, mods: []});
  }
  // позиции для фасовки
  const items = [];
  dishes.forEach((d, di) => {
    d.people.forEach(p => items.push({key: `${d.dish}||${p.name}`, dish: d.dish, di, mod: "", client: p.name, qty: p.qty}));
    d.mods.forEach(m => m.people.forEach(p => items.push({key: `${d.dish}|${m.mod}|${p.name}`, dish: d.dish, di, mod: m.mod, client: p.name, qty: p.qty})));
    const main = d.people.reduce((s, p) => s + p.qty, 0), mods = d.mods.reduce((s, m) => s + m.people.reduce((a, p) => a + p.qty, 0), 0);
    d.main = main; d.modsQty = mods; d.total = main + mods;
    d.warn = d.stated != null && d.stated !== main && d.stated !== main + mods ? `в тексте ${d.stated}, по именам ${main}${mods ? ` + ${mods} с заменами` : ""}` : "";
    d.mods.forEach(m => { const q = m.people.reduce((a, p) => a + p.qty, 0); m.warn = m.stated != null && m.stated !== q ? `в тексте ${m.stated}, по именам ${q}` : ""; });
  });
  return {dishes, items};
}
const isPacked = it => !!PACK.checks[it.key];
function routeNum(name) {
  const route = ordered().filter(x => !isOff(x));
  const k = route.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
  return k >= 0 ? k + 1 : 0;
}
function renderPack() {
  if (!PACK.text || packEditing) return renderPackInput();
  const {dishes, items} = parsePack(PACK.text);
  if (!items.length) { packEditing = true; return renderPackInput("Не получилось разобрать список — проверь формат."); }
  const clients = {};
  for (const it of items) (clients[it.client] = clients[it.client] || []).push(it);
  const names = Object.keys(clients).sort((a, b) => a.localeCompare(b));
  const cDone = n => clients[n].every(isPacked);
  const doneClients = names.filter(cDone).length;
  const totalQty = items.reduce((s, it) => s + it.qty, 0), doneQty = items.filter(isPacked).reduce((s, it) => s + it.qty, 0);
  const warns = dishes.flatMap(d => [d.warn ? `${d.dish}: ${d.warn}` : "", ...d.mods.map(m => m.warn ? `${d.dish} · ${m.mod}: ${m.warn}` : "")]).filter(Boolean);

  if (PACK.open && clients[PACK.open]) return renderPackClient(PACK.open, clients[PACK.open]);

  packEl.innerHTML = `<div class="panel pstat">
      <div class="pnums"><div><b>${doneClients}<small>/${names.length}</small></b><span>клиентов собрано</span></div><div><b>${doneQty}<small>/${totalQty}</small></b><span>боксов</span></div></div>
      <div class="cprog"><i style="width:${totalQty ? Math.round(doneQty / totalQty * 100) : 0}%"></i></div>
      <div class="seg"><button class="${PACK.view === "clients" ? "on" : ""}" data-p="view" data-v="clients">👤 По клиентам</button><button class="${PACK.view === "dishes" ? "on" : ""}" data-p="view" data-v="dishes">🍱 По блюдам</button></div>
    </div>
    ${warns.length ? `<div class="pwarn">⚠ Проверь количество:<br>${warns.map(esc).join("<br>")}</div>` : ""}
    ${PACK.view === "clients" ? `<ul class="list">${names.sort((a, b) => cDone(a) - cDone(b) || a.localeCompare(b)).map(n => {
        const its = clients[n], q = its.reduce((s, it) => s + it.qty, 0), dq = its.filter(isPacked).reduce((s, it) => s + it.qty, 0);
        const done = dq === q, rn = routeNum(n), hasMod = its.some(it => it.mod);
        return `<li class="item${done ? " delivered" : ""}"><button class="row" data-p="client" data-n="${esc(n)}">
          <span class="av${done ? "" : " pav"}">${done ? "✓" : q}</span>
          <span><div class="nm">${esc(n)}${hasMod ? `<span class="flag fl3">замена</span>` : ""}${rn ? `<span class="flag">🚗 ${rn}</span>` : ""}</div>
          <div class="sub">${dq}/${q} · ${esc([...new Set(its.map(it => shortDish(it.dish)))].join(", "))}</div></span></button></li>`;
      }).join("")}</ul>`
    : dishes.map((d, di) => {
        const its = items.filter(it => it.di === di), dq = its.filter(isPacked).reduce((s, it) => s + it.qty, 0);
        return `<div class="panel pdish${dq === d.total ? " pdone" : ""}"><div class="pdh"><b>${esc(d.dish)}</b><span class="pcount">${dq}/${d.total}</span></div>
          ${its.map(it => packRow(it, true)).join("")}</div>`;
      }).join("")}
    <div class="backup"><button class="btn" data-p="edit">✏️ Изменить список</button><button class="btn" data-p="new">🆕 Новый список</button></div>`;
}
const shortDish = d => d.length > 26 ? d.slice(0, 24).trim() + "…" : d;
function packRow(it, showClient) {
  const on = isPacked(it);
  return `<button class="ingrow prow${on ? " on" : ""}" data-p="check" data-key="${esc(it.key)}">
    <span class="ck">${on ? "✓" : ""}</span>
    <span class="iname">${esc(showClient ? it.client : it.dish)}${it.mod ? `<span class="modb">${esc(it.mod)}</span>` : ""}</span>
    <span class="iamt">${it.qty > 1 ? `×${it.qty}` : ""}</span>
  </button>`;
}
function renderPackClient(name, its) {
  const q = its.reduce((s, it) => s + it.qty, 0), done = its.every(isPacked), rn = routeNum(name);
  packEl.innerHTML = `<button class="back" data-p="back">← Все клиенты</button>
    <div class="panel"><div class="top"><span class="av pav">${q}</span><h2 class="cond">${esc(name)}</h2></div>
      ${rn ? `<p class="rmeta">🚗 В маршруте доставки № ${rn}</p>` : ""}
      ${its.some(it => it.mod) ? `<div class="pwarn">⚠ Есть замены — смотри красные пометки</div>` : ""}
      ${its.map(it => packRow(it, false)).join("")}
      <button class="cookbtn" data-p="all" data-n="${esc(name)}" style="margin-top:12px">${done ? "↩ Снять все галочки" : "✓ Всё собрано"}</button>
    </div>`;
}
function renderPackInput(err) {
  packEl.innerHTML = `<div class="panel"><h2 class="cond" style="margin:0 0 6px;font-size:24px">📦 Список фасовки</h2>
    <p class="rmeta">Вставь текст списка как есть: «Блюдо - Имя, Имя x2 - 18». Строки БОЛЬШИМИ буквами (NO ONIONS…) — замены к блюду выше.</p>
    <textarea id="ptext" rows="10" placeholder="Вставь список сюда">${esc(PACK.text)}</textarea>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <div class="two" style="margin-top:8px"><button class="btn" data-p="paste">📋 Из буфера</button><button class="btn save" data-p="parse">Разобрать →</button></div>
    ${PACK.text ? `<button class="back" data-p="cancel">← Отмена</button>` : ""}
  </div>`;
}
packEl.addEventListener("click", async e => {
  const a = e.target.closest("[data-p]");
  if (!a) return;
  const k = a.dataset.p;
  if (k === "view") { PACK.view = a.dataset.v; savePack(); renderPack(); }
  if (k === "client") { PACK.open = a.dataset.n; savePack(); renderPack(); window.scrollTo(0, 0); }
  if (k === "back") { PACK.open = null; savePack(); renderPack(); }
  if (k === "check") {
    const key = a.dataset.key, was = !!PACK.checks[key];
    if (was) delete PACK.checks[key]; else PACK.checks[key] = 1;
    savePack();
    const {items} = parsePack(PACK.text);
    const it = items.find(x => x.key === key);
    if (!was && it && items.filter(x => x.client === it.client).every(isPacked)) { celebrate(a); showToast(`📦 ${it.client} — собрано`, false); }
    renderPack();
  }
  if (k === "all") {
    const {items} = parsePack(PACK.text), its = items.filter(x => x.client === a.dataset.n), done = its.every(isPacked);
    its.forEach(it => { if (done) delete PACK.checks[it.key]; else PACK.checks[it.key] = 1; });
    savePack();
    if (!done) { celebrate(a); showToast(`📦 ${a.dataset.n} — собрано`, false); PACK.open = null; savePack(); }
    renderPack(); window.scrollTo(0, 0);
  }
  if (k === "edit") { packEditing = true; renderPack(); }
  if (k === "cancel") { packEditing = false; renderPack(); }
  if (k === "new") {
    if (!(await confirmBox("Начать новый список?", "Текущий список и галочки удалятся.", "Да, новый", true))) return;
    PACK.text = ""; PACK.checks = {}; PACK.open = null; savePack(); packEditing = true; renderPack();
  }
  if (k === "paste") {
    try { const t = await navigator.clipboard.readText(); if (t) document.getElementById("ptext").value = t; }
    catch (er) { showToast("Не дали доступ к буферу — вставь вручную (долгое нажатие → Вставить)", false); }
  }
  if (k === "parse") {
    const t = document.getElementById("ptext").value.trim();
    const {items} = parsePack(t);
    if (!items.length) return renderPackInput("Не нашёл ни одного блюда. Формат: «Блюдо - Имя, Имя x2 - 18».");
    // галочки сохраняются для тех же блюд и людей (если список поправили утром)
    const keys = new Set(items.map(it => it.key));
    Object.keys(PACK.checks).forEach(key => { if (!keys.has(key)) delete PACK.checks[key]; });
    PACK.text = t; PACK.open = null; PACK.savedAt = new Date().toISOString(); packEditing = false; savePack(); renderPack(); window.scrollTo(0, 0);
  }
});

// --- вкладки ---
const deliveryMain = document.getElementById("delivery");
function switchTab(t) {
  if (!["delivery", "kitchen", "pack"].includes(t)) t = "delivery";
  const k = t === "kitchen";
  deliveryMain.hidden = t !== "delivery"; kitchen.hidden = t !== "kitchen"; packEl.hidden = t !== "pack";
  if (t === "pack") renderPack();
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  try { localStorage.setItem("knc-tab", t); } catch (e) {}
  if (k) renderKitchen();
  window.scrollTo(0, 0);
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) switchTab(b.dataset.tab); });
let startTab = "delivery"; try { startTab = localStorage.getItem("knc-tab") || "delivery"; } catch (e) {}
switchTab(startTab);
renderTimers();

renderHeader();
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
